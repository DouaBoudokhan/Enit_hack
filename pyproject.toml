[project]
name = "mycrew"
version = "0.1.0"
description = "CrewAI project"
requires-python = ">=3.10"
dependencies = [
  "crewai",
  "python-dotenv",
  "pyyaml",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
