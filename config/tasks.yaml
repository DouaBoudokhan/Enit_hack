analyze_content_task:
  description: >
    Analyze the following influencer's posts and comments. The influencer data is provided below as JSON.

    INFLUENCER DATA:
    {influencer_data}

    For EACH comment in every post, determine:
    - language: one of Darija, Arabic, French, English, emoji_only, mixed
    - sentiment: positive, negative, or neutral
    - irony_flag: boolean
    - quality_score: integer 1-10 reflecting genuine engagement value
    - toxicity_flag: boolean (flag true ONLY when bot signals are combined: same username across multiple posts with identical text, accounts with is_private true and zero likes/replies across many comments, or clear spam. Pure emoji comments like ❤️❤️❤️ or Darija affection expressions are GENUINE and must NOT be flagged)

    For EACH post, determine:
    - content_theme: short phrase describing the post topic from enriched_content
    - visual_category: one of fashion, beauty, lifestyle, food, travel, fitness, tech, entertainment, family, culture, other

    AGGREGATE across all posts:
    - inferred_domain: object with "primary" (string) and "secondary" (array of up to 3 strings), derived from observed post themes and visual categories
    - top_languages: ranked list of detected languages by frequency
    - avg_quality_score: float average of all comment quality_scores
    - toxicity_rate: float proportion of comments flagged as toxic
    - total_comments_analyzed: integer count of all comments analyzed

    Return a single JSON object with:
    - "posts": array of per-post analysis objects (each containing post_id, content_theme, visual_category, and analyzed comments array)
    - "inferred_domain": the aggregate domain object
    - "top_languages": the ranked language list
    - "avg_quality_score": the average quality score
    - "toxicity_rate": the toxicity rate
    - "total_comments_analyzed": the total count

    Return ONLY valid JSON, no markdown formatting.
  expected_output: >
    A single JSON object containing per-post analysis array with comment annotations,
    and aggregate fields: inferred_domain, top_languages, avg_quality_score, toxicity_rate,
    total_comments_analyzed.
  agent: content_analysis_agent

build_profile_task:
  description: >
    Using the content analysis results from the previous task, compute the CQS and build
    the influencer profile card.

    The influencer metadata is:
    {influencer_data}

    CQS FORMULA:
    - sentiment_score = avg_quality_score from content analysis (range 0-10)
    - engagement_rate = (sum of all likes_count + sum of all comments_count across all posts) / follower_count / number_of_posts * 100
    - toxicity_penalty = toxicity_rate * 10
    - authenticity_score = (1 - toxicity_rate) * 100
    - CQS_raw = (sentiment_score * 0.3) + (engagement_rate * 0.2) + (authenticity_score * 0.3) - (toxicity_penalty * 0.2)
    - Normalize CQS_raw to 0-100 range (clamp between 0 and 100)

    LABELS:
    - audience_health: CQS > 70 = "Healthy", 40-70 = "Moderate", below 40 = "At-Risk"
    - engagement_depth: engagement_rate > 3% = "High", 1-3% = "Medium", below 1% = "Low"

    Return a JSON profile card with exactly these fields:
    handle, name, category, profile_url, image_url, follower_count, CQS (rounded to 1 decimal),
    audience_health, engagement_depth, top_languages, inferred_domain, toxicity_rate, total_comments_analyzed.

    Return ONLY valid JSON, no markdown formatting.
  expected_output: >
    A JSON profile card object with: handle, name, category, profile_url, image_url,
    follower_count, CQS, audience_health, engagement_depth, top_languages, inferred_domain,
    toxicity_rate, total_comments_analyzed.
  agent: community_profiler_agent
  context:
    - analyze_content_task

match_product_task:
  description: >
    Given the influencer profile card from the previous task and the following product description,
    determine brand-influencer fit using direct reasoning.

    PRODUCT DESCRIPTION:
    {product_description}

    Analyze the influencer's inferred_domain (primary and secondary niches), category,
    audience_health, and engagement patterns. Reason about how well the influencer's
    content and audience align with the product.

    Produce:
    - match_percentage: integer 0-100 representing fit strength
    - fit_reason: one sentence explaining the match rationale

    Return ONLY a JSON object with match_percentage and fit_reason fields, no markdown formatting.

    IMPORTANT: If the product description is empty or not provided, return:
    {{"match_percentage": null, "fit_reason": "No product description provided."}}
  expected_output: >
    A JSON object with match_percentage (0-100) and fit_reason (one sentence).
  agent: match_agent
  context:
    - build_profile_task
